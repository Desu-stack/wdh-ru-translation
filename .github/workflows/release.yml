name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install pyinstaller bsdiff4

      - name: Build patcher
        run: python -m PyInstaller --noconfirm --onedir --windowed --name WDH_RU_Patcher patcher/patcher.py

      - name: Assemble release
        shell: pwsh
        run: |
          $dst = "dist/WDH_RU_Patcher"
          Copy-Item "patcher/manifest.json" $dst
          Copy-Item "patcher/payload" $dst -Recurse
          Copy-Item "README.md","LICENSE" $dst
          python tools/make_checksums.py $dst
          Compress-Archive -Path $dst -DestinationPath "WDH_RU_Patcher-${{ github.ref_name }}.zip"

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: WDH_RU_Patcher-*.zip
          generate_release_notes: true
